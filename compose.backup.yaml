# Production database backup overlay. R2 credentials are supplied only through the
# protected host environment. The bucket is private and dedicated to this prefix.
x-walg-environment: &walg-environment
  WALG_S3_PREFIX: s3://${R2_BACKUP_BUCKET:-}/a-tiny-civilization/postgres
  AWS_ENDPOINT: https://${R2_ACCOUNT_ID:-}.r2.cloudflarestorage.com
  AWS_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
  AWS_REGION: auto
  AWS_S3_FORCE_PATH_STYLE: "true"
  WALG_COMPRESSION_METHOD: zstd
  WALG_PREVENT_WAL_OVERWRITE: "true"
  WALG_LIBSODIUM_KEY: ${WALG_LIBSODIUM_KEY:-}
  WALG_LIBSODIUM_KEY_TRANSFORM: hex

services:
  db:
    image: a-tiny-civilization-postgres-walg:3.0.8-pg17
    build:
      context: .
      dockerfile: Dockerfile.postgres-walg
      network: host
    environment:
      <<: *walg-environment
      POSTGRES_DB: ${POSTGRES_DB:-civilization}
      POSTGRES_USER: ${POSTGRES_USER:-civilization}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      PGDATABASE: ${POSTGRES_DB:-civilization}
      PGUSER: ${POSTGRES_USER:-civilization}
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=wal-g wal-push %p
      - -c
      - archive_timeout=60s
