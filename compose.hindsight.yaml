x-local-logging: &local-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  local-cognition:
    image: ollama/ollama@sha256:b88c73ace3e115f8ec53dc8761ae1c0aabfa675406e3681786b98757ce050f42
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "true"
    healthcheck:
      test: ["CMD", "ollama", "show", "qwen2.5:1.5b"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    volumes:
      - local-cognition-models:/root/.ollama
    networks:
      - backend
    restart: unless-stopped
    logging: *local-logging

  hindsight:
    image: ghcr.io/vectorize-io/hindsight:0.8.6@sha256:ffa391a77284e49f6b55e32c86f33529ac4257831407b14038a72b6a0a232039
    # Embedded PostgreSQL's vector index builds can request roughly 512 MiB of
    # POSIX shared memory; Docker's 64 MiB default fails retain operations.
    shm_size: 1gb
    environment:
      HINDSIGHT_API_LLM_PROVIDER: none
      HINDSIGHT_API_RETAIN_EXTRACTION_MODE: chunks
      HINDSIGHT_API_FAIL_ON_EXTRACTION_ERRORS: "true"
      HINDSIGHT_API_STORE_DOCUMENT_TEXT: "false"
      HINDSIGHT_API_WORKER_ID: local-development-worker
      # Existing local vector state plus cold model initialization can exceed the
      # image's five-minute supervisor default on this host.
      HINDSIGHT_API_STARTUP_WAIT_SECONDS: "900"
      HINDSIGHT_API_MODEL_INIT_TIMEOUT: "900"
      # This host keeps both pinned local models in the named cache. Metadata
      # lookups are unnecessary runtime egress and can stall a cold restart.
      HF_HUB_OFFLINE: ${HINDSIGHT_HF_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${HINDSIGHT_HF_OFFLINE:-1}
    expose:
      - "8888"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8888/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 180s
    volumes:
      - hindsight-data:/home/hindsight/.pg0
      - hindsight-model-cache:/home/hindsight/.cache
    networks:
      - backend
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *local-logging

  runner:
    environment:
      HINDSIGHT_BASE_URL: http://hindsight:8888
    depends_on:
      hindsight:
        condition: service_healthy

  memory-worker:
    image: a-tiny-civilization-app:local
    command: ["/app/civilization-runner", "memory-worker"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-civilization}:${POSTGRES_PASSWORD:-local-development-only}@db:5432/${POSTGRES_DB:-civilization}
      RUST_LOG: ${RUST_LOG:-info}
      HINDSIGHT_BASE_URL: http://hindsight:8888
      HINDSIGHT_API_KEY: ${HINDSIGHT_API_KEY:-}
      MEMORY_WORKER_ID: ${MEMORY_WORKER_ID:-local-memory-worker}
      MEMORY_POLL_MILLISECONDS: ${MEMORY_POLL_MILLISECONDS:-500}
      MEMORY_CLAIM_LEASE_SECONDS: ${MEMORY_CLAIM_LEASE_SECONDS:-60}
      HINDSIGHT_REQUEST_TIMEOUT_SECONDS: ${HINDSIGHT_REQUEST_TIMEOUT_SECONDS:-15}
    depends_on:
      migrate:
        condition: service_healthy
      hindsight:
        condition: service_healthy
    networks:
      - backend
    init: true
    restart: unless-stopped
    logging: *local-logging
    stop_grace_period: 60s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  cognition-worker:
    image: a-tiny-civilization-app:local
    command: ["/app/civilization-runner", "cognition-worker"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-civilization}:${POSTGRES_PASSWORD:-local-development-only}@db:5432/${POSTGRES_DB:-civilization}
      RUST_LOG: ${RUST_LOG:-info}
      HINDSIGHT_BASE_URL: http://hindsight:8888
      HINDSIGHT_API_KEY: ${HINDSIGHT_API_KEY:-}
      COGNITION_WORKER_ID: ${COGNITION_WORKER_ID:-local-cognition-worker}
      COGNITION_POLL_MILLISECONDS: ${COGNITION_POLL_MILLISECONDS:-250}
      COGNITION_CLAIM_LEASE_SECONDS: ${COGNITION_CLAIM_LEASE_SECONDS:-60}
      COGNITION_REQUEST_TIMEOUT_SECONDS: ${COGNITION_REQUEST_TIMEOUT_SECONDS:-45}
      LOCAL_COGNITION_BASE_URL: ${LOCAL_COGNITION_BASE_URL:-http://local-cognition:11434/v1}
      COGNITION_EXTERNAL_EXPORT_APPROVED: ${COGNITION_EXTERNAL_EXPORT_APPROVED:-false}
      CLOUDFLARE_WORKERS_AI_BASE_URL: ${CLOUDFLARE_WORKERS_AI_BASE_URL:-}
      CLOUDFLARE_WORKERS_AI_API_KEY: ${CLOUDFLARE_WORKERS_AI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CANCER_OPENROUTER_API_KEY: ${CANCER_OPENROUTER_API_KEY:-}
      COGNITION_PAID_ENABLED: ${COGNITION_PAID_ENABLED:-false}
    depends_on:
      migrate:
        condition: service_healthy
      hindsight:
        condition: service_healthy
      local-cognition:
        condition: service_healthy
    networks:
      - backend
    init: true
    restart: unless-stopped
    logging: *local-logging
    stop_grace_period: 60s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  hindsight-data:
    name: a-tiny-civilization-hindsight-v1
    external: true
  hindsight-model-cache:
    name: a-tiny-civilization-hindsight-model-cache-v1
    external: true
  local-cognition-models:
    name: atiny-ollama
    external: true
