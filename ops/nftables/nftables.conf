#!/usr/sbin/nft -f

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        iifname "lo" accept
        ct state invalid drop
        ct state established,related accept

        # DHCP replies and essential IPv4/IPv6 control traffic.
        udp sport 67 udp dport 68 accept
        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept

        # Public services: SSH, HTTP, HTTPS (including HTTP/3).
        tcp dport { 22, 80, 443 } ct state new accept
        udp dport 443 ct state new accept

        limit rate 5/second burst 10 packets log prefix "nft-input-drop: " level warn
    }

    chain forward {
        type filter hook forward priority 0; policy drop;

        # Docker's dedicated cognition bridge may initiate DNS and HTTPS only.
        # The shared backend bridge remains unable to initiate Internet traffic.
        ct state established,related accept
        iifname "br-atiny-cog" udp dport 53 accept
        iifname "br-atiny-cog" tcp dport { 53, 443 } accept
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
