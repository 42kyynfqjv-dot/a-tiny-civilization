name: a-tiny-civilization

x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:-development}
  RUST_LOG: ${RUST_LOG:-info}
  DATABASE_URL: postgres://${POSTGRES_USER:-civilization}:${POSTGRES_PASSWORD:-local-development-only}@db:5432/${POSTGRES_DB:-civilization}

x-local-logging: &local-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-rust-service: &rust-service
  image: a-tiny-civilization-app:local
  build:
    context: .
    dockerfile: Dockerfile
    network: host
  environment: *app-environment
  networks:
    - backend
  init: true
  logging: *local-logging
  stop_grace_period: 60s
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-civilization}
      POSTGRES_USER: ${POSTGRES_USER:-civilization}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      # Applies only when PostgreSQL creates a new cluster. Existing volumes are
      # checked at runtime and cannot silently pass without page checksums.
      POSTGRES_INITDB_ARGS: --data-checksums
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped
    logging: *local-logging
    stop_grace_period: 60s

  migrate:
    <<: *rust-service
    command:
      [
        "/bin/sh",
        "-c",
        "/app/civilization-api migrate && touch /tmp/migrations-complete && exec sleep infinity",
      ]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/migrations-complete"]
      interval: 2s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  api:
    <<: *rust-service
    command: ["/app/civilization-api", "serve"]
    environment:
      <<: *app-environment
      API_BIND: 0.0.0.0:8080
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_SUPPORTER_PRICE_ID: ${STRIPE_SUPPORTER_PRICE_ID:-}
      STRIPE_WEBHOOK_TOLERANCE_SECONDS: ${STRIPE_WEBHOOK_TOLERANCE_SECONDS:-300}
      STRIPE_LIVE_MODE: ${STRIPE_LIVE_MODE:-false}
      STRIPE_SUPPORTER_CURRENCY: ${STRIPE_SUPPORTER_CURRENCY:-usd}
      STRIPE_SUPPORTER_AMOUNT_MINOR: ${STRIPE_SUPPORTER_AMOUNT_MINOR:-500}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-https://atinycivilization.com/?supporter=success}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-https://atinycivilization.com/?supporter=cancelled}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-https://atinycivilization.com/api/v1/auth/google/callback}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      APPLE_REDIRECT_URI: ${APPLE_REDIRECT_URI:-https://atinycivilization.com/api/v1/auth/apple/callback}
      ATINY_MODERATOR_ID: ${ATINY_MODERATOR_ID:-}
    depends_on:
      migrate:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    networks:
      - backend
      # Only the web server may reach the observer API. In particular, the public
      # tunnel is deliberately absent from this network.
      - web-api
    restart: unless-stopped

  runner:
    <<: *rust-service
    command: ["/app/civilization-runner", "serve"]
    environment:
      <<: *app-environment
      RUNNER_HEARTBEAT_SECONDS: ${RUNNER_HEARTBEAT_SECONDS:-5}
      RUNNER_TICK_MILLISECONDS: ${RUNNER_TICK_MILLISECONDS:-1000}
      ATINY_CIVILIZATION_DATA_EXECUTABLE: /app/civilization-data
      ATINY_JPL_DE441_INPUT_DIRECTORY: /runtime/data/source-cache/jpl-de441
    depends_on:
      migrate:
        condition: service_healthy
    volumes:
      # The runner may read content-addressed inputs—including DE441 source bytes
      # for a future source-backed celestial driver—but must never mutate them.
      - ${ATINY_RUNTIME_ARTIFACT_ROOT:-./runtime-artifacts}:/runtime:ro
    restart: unless-stopped

  projector:
    <<: *rust-service
    command: ["/app/civilization-projector", "serve"]
    environment:
      <<: *app-environment
      PROJECTOR_POLL_SECONDS: ${PROJECTOR_POLL_SECONDS:-5}
    depends_on:
      migrate:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: a-tiny-civilization-web:local
    build:
      context: web
      dockerfile: Dockerfile
      network: host
    environment:
      OBSERVER_API_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 8s
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    networks:
      - edge
      - web-api
    init: true
    restart: unless-stopped
    logging: *local-logging
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
    name: a-tiny-civilization-postgres-v1
    external: true

networks:
  backend:
    driver: bridge
  edge:
    driver: bridge
  web-api:
    driver: bridge
    internal: true
