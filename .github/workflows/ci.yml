name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A pushed checkpoint must finish its verification once it starts. GitHub still
  # coalesces superseded pending runs, but never aborts the only active evidence.
  cancel-in-progress: false

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://civilization:ci-only@127.0.0.1:5432/civilization
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: civilization
          POSTGRES_USER: civilization
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U civilization -d civilization"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install repository verification tools
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: ./scripts/audit-dependencies.sh rust
      - run: ./scripts/check-boundaries.sh
      - run: ./scripts/verify-demo.sh

  web:
    name: Observatory
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: ../scripts/audit-dependencies.sh web
      - run: npm run lint
      - run: npm test

  compose:
    name: Deployment boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install repository verification tools
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - run: docker compose -f compose.yaml config --quiet
      - run: docker compose -f compose.yaml -f compose.hindsight.yaml config --quiet
      - run: docker compose -f compose.yaml -f compose.backup.yaml config --quiet
      - run: RESTORE_WORLD_ID=00000000-0000-0000-0000-000000000001 docker compose -f compose.restore.yaml config --quiet
      - run: ./scripts/check-production-boundaries.sh
      - run: ./scripts/verify-container-image-pins.sh
      - run: ./scripts/verify-container-log-policy.sh
      - run: ./scripts/verify-postgres-durability.sh
      - run: ./scripts/verify-production-runtime-gate.sh
      - run: ./scripts/verify-public-genesis-preflight.sh
      - run: ./scripts/verify-live-genesis-gate.sh
      - run: bash -n scripts/*.sh
      - run: >-
          APP_ENV=production
          POSTGRES_DB=civilization
          POSTGRES_USER=civilization
          POSTGRES_PASSWORD=ci-production-check-only
          OPENROUTER_API_KEY=ci-provider-check-only
          COGNITION_EXTERNAL_EXPORT_APPROVED=true
          CLOUDFLARE_TUNNEL_TOKEN=ci-production-check-only
          R2_ACCOUNT_ID=0123456789abcdef0123456789abcdef
          R2_BACKUP_BUCKET=a-tiny-civilization-backups
          R2_ACCESS_KEY_ID=ci-r2-access-key-only
          R2_SECRET_ACCESS_KEY=ci-r2-secret-key-only
          WALG_LIBSODIUM_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          ./scripts/production-preflight.sh
