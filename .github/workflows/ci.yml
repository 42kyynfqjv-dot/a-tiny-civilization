name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A pushed checkpoint must finish its verification once it starts. GitHub still
  # coalesces superseded pending runs, but never aborts the only active evidence.
  cancel-in-progress: false

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://civilization:ci-only@127.0.0.1:5432/civilization
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: civilization
          POSTGRES_USER: civilization
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U civilization -d civilization"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install repository verification tools
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: ./scripts/check-boundaries.sh
      - run: ./scripts/verify-demo.sh

  web:
    name: Observatory
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm test

  compose:
    name: Deployment boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install repository verification tools
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - run: docker compose -f compose.yaml config --quiet
      - run: docker compose -f compose.yaml -f compose.hindsight.yaml config --quiet
      - run: docker compose -f compose.yaml -f compose.backup.yaml config --quiet
      - run: RESTORE_WORLD_ID=00000000-0000-0000-0000-000000000001 docker compose -f compose.restore.yaml config --quiet
      - run: ./scripts/check-production-boundaries.sh
      - run: bash -n scripts/backend-status.sh scripts/backup-postgres.sh scripts/backup-status.sh scripts/deploy-production-app.sh scripts/moderation-status.sh scripts/postgres-restore-entrypoint.sh scripts/restore-drill.sh scripts/production-preflight.sh scripts/verify-backend-status.sh scripts/verify-production-env-file.sh scripts/verify-supporter-production-policy.sh
      - run: >-
          APP_ENV=production
          POSTGRES_DB=civilization
          POSTGRES_USER=civilization
          POSTGRES_PASSWORD=ci-production-check-only
          CLOUDFLARE_TUNNEL_TOKEN=ci-production-check-only
          R2_ACCOUNT_ID=0123456789abcdef0123456789abcdef
          R2_BACKUP_BUCKET=a-tiny-civilization-backups
          R2_ACCESS_KEY_ID=ci-r2-access-key-only
          R2_SECRET_ACCESS_KEY=ci-r2-secret-key-only
          WALG_LIBSODIUM_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          ./scripts/production-preflight.sh
