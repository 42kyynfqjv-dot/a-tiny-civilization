name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://civilization:ci-only@127.0.0.1:5432/civilization
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: civilization
          POSTGRES_USER: civilization
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U civilization -d civilization"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: ./scripts/check-boundaries.sh
      - run: ./scripts/verify-demo.sh

  web:
    name: Observatory
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm test

  compose:
    name: Deployment boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f compose.yaml config --quiet
      - run: docker compose -f compose.yaml -f compose.hindsight.yaml config --quiet
      - run: ./scripts/check-production-boundaries.sh
      - run: >-
          APP_ENV=production
          POSTGRES_DB=civilization
          POSTGRES_USER=civilization
          POSTGRES_PASSWORD=ci-production-check-only
          CLOUDFLARE_TUNNEL_TOKEN=ci-production-check-only
          ./scripts/production-preflight.sh
